<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Collection - Iron Sight Codex</title>

    <link rel="stylesheet" href="../css/style.css">

    <script>
        tailwind.config = {
            corePlugins: {
                preflight: false
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <header class="site-header">
        <div class="header-inner">

            <div class="brand">
                <span class="brand-dot"></span>
                <div>
                    <h1>Iron Sight Codex</h1>
                    <p>// DIGITAL FIREARMS ARCHIVE</p>
                </div>
            </div>

            <nav class="nav flex flex-row flex-nowrap items-center justify-center gap-1 md:gap-2">
                <a href="../index.html">HOME</a>
                <a href="detail.html">ARCHIVE</a>
                <a href="form.html" class="active">ADD COLLECTION</a>
            </nav>

        </div>
    </header>

    <main>

        <section class="form-card codex-card p-5 md:p-8">

            <div class="section-heading form-heading">
                <div>
                    <h2>Add New Collection</h2>
                    <p class="form-subtitle">// SUBMIT NEW DOSSIER ENTRY TO CENTRAL ARCHIVE</p>
                </div>
            </div>

            <form class="space-y-5">

                <div class="form-group flex flex-col gap-2">
                    <label for="name">Name</label>
                    <input class="w-full box-border px-3 py-3" 
                        type="text" id="name" name="name"
                        placeholder="e.g. M1 Garand, Thompson SMG">
                </div>

                <div class="form-row grid grid-cols-1 md:grid-cols-2 gap-5">

                    <div class="form-group flex flex-col gap-2">
                        <label for="origin">Origin</label>
                        <input class="w-full box-border px-3 py-3"
                            type="text" id="origin" name="origin"
                            placeholder="e.g. United States, Germany">
                    </div>

                    <div class="form-group flex flex-col gap-2">
                        <label for="category">Category</label>
                        <select class="w-full box-border px-3 py-3"
                         id="category" name="category">
                            <option value="">Select Category</option>
                            <option value="rifle">Rifle</option>
                            <option value="handgun">Handgun</option>
                            <option value="shotgun">Shotgun</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                </div>

                <div class="form-group flex flex-col gap-2">
                    <label for="image">Image File</label>
                    <input class="w-full box-border px-3 py-3" 
                    type="file" id="image" name="image" accept="image/*">
                </div>

                <div class="form-group flex flex-col gap-2">
                    <label for="description">Historical Briefing / Description</label>
                    <textarea class="w-full box-border px-3 py-3" 
                        id="description" name="description"
                        placeholder="Enter detailed historical background, operational records, and tactical usage..."></textarea>
                </div>

                <div class="form-actions flex flex-wrap items-center justify-end gap-4">
                    <button type="button" class="button button-secondary">
                        CANCEL
                    </button>

                    <button type="submit" class="button button-primary">
                        + ADD COLLECTION
                    </button>
                </div>

            </form>

        </section>

    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <p>&copy; 2026 Iron Sight Codex</p>
            <p>WEB PROGRAMMING PROJECT</p>
        </div>
    </footer>

</body>
</html>
